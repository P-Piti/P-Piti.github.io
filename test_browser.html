
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA Browser v0.2</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #20252b;
    --panel: #303840;
    --panel2: #252d34;
    --input: #171c21;
    --line: #414b54;
    --green: #4c806b;
    --green2: #60977f;
    --text: #eee;
    --muted: #aeb9b2;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.browser {
    width: 96%;
    max-width: 1450px;
    margin: 22px auto;
    background: var(--panel);
    padding: 16px;
    border-radius: 13px;
    box-shadow: 0 10px 35px #0006;
    min-height: calc(100vh - 44px);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 13px;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand h2 {
    margin: 0;
    font-size: 21px;
}

.version {
    color: #91b9a5;
    font-size: 12px;
}

.tabs {
    display: flex;
    gap: 5px;
    align-items: center;
    overflow-x: auto;
    padding: 3px 2px 9px;
    min-height: 43px;
}

.tab {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 125px;
    max-width: 220px;
    padding: 9px 10px;
    border-radius: 8px 8px 0 0;
    background: #252d34;
    color: #cbd8d0;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
    white-space: nowrap;
}

.tab.active {
    background: #3a454d;
    border-color: #526159;
    color: white;
}

.tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

.tab-close {
    border: 0;
    background: transparent;
    padding: 0 2px;
    color: #aeb9b2;
    font-size: 16px;
}

.tab-close:hover {
    background: transparent;
    color: white;
}

.new-tab {
    min-width: 36px;
    padding: 8px 12px;
}

.toolbar {
    display: flex;
    gap: 7px;
    align-items: center;
    margin-bottom: 10px;
}

.navigation {
    display: flex;
    gap: 5px;
}

input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--input);
    color: white;
    outline: none;
}

input:focus {
    border-color: var(--green2);
}

button {
    padding: 10px 13px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    background: var(--green);
    color: white;
    transition: .15s;
    font-size: 13px;
}

button:hover {
    background: var(--green2);
}

button:disabled {
    opacity: .35;
    cursor: default;
}

.secondary {
    background: #414c55;
}

.secondary:hover {
    background: #52645d;
}

.iconbtn {
    min-width: 38px;
    padding: 10px;
}

.tools {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0;
}

.tools button {
    background: #414c55;
}

.tools button:hover {
    background: #52645d;
}

.panel {
    display: none;
    background: var(--panel2);
    padding: 13px;
    border-radius: 8px;
    margin: 10px 0;
    border: 1px solid #3d484f;
}

.panel.show {
    display: block;
}

.panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.panel-head strong {
    font-size: 14px;
}

.panel-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.panel-search {
    width: 100%;
    margin: 0 0 9px;
}

.list {
    display: grid;
    gap: 5px;
    max-height: 220px;
    overflow: auto;
}

.list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px;
    background: #303a42;
    border-radius: 6px;
}

.list-item .item-url {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    color: #cbd8d0;
    font-size: 12px;
}

.list-item button {
    padding: 7px 9px;
}

.quick-links {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 12px 0;
}

.quick-links button {
    background: #414c55;
    font-size: 12px;
}

.status {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 3px;
    color: var(--muted);
    font-size: 12px;
}

.progress {
    height: 3px;
    background: #20272d;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
}

.progress span {
    display: block;
    width: 0;
    height: 100%;
    background: #79b99a;
    transition: width .25s;
}

.viewer {
    position: relative;
}

iframe {
    display: block;
    width: 100%;
    height: min(69vh, 800px);
    min-height: 440px;
    border: 0;
    border-radius: 7px;
    background: white;
}

.startpage {
    display: none;
    min-height: 440px;
    height: min(69vh, 800px);
    border-radius: 7px;
    background: radial-gradient(circle at 50% 25%, #34463f, #20272d 65%);
    padding: 35px 20px;
    text-align: center;
    overflow: auto;
}

.startpage.show {
    display: block;
}

.startpage h1 {
    font-size: 34px;
    letter-spacing: 5px;
    margin: 35px 0 8px;
}

.startpage p {
    color: #aeb9b2;
    margin: 0 0 25px;
    font-size: 13px;
}

.start-search {
    display: flex;
    gap: 7px;
    max-width: 650px;
    margin: 0 auto 28px;
}

.start-search input {
    background: #171c21;
}

.tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    max-width: 780px;
    margin: auto;
}

.tile {
    background: #303c42;
    border: 1px solid #526159;
    border-radius: 10px;
    padding: 18px 10px;
    color: #e8eee9;
    cursor: pointer;
    min-height: 80px;
}

.tile:hover {
    background: #40554b;
}

.tile span {
    display: block;
    font-size: 12px;
    margin-top: 7px;
    overflow-wrap: anywhere;
}

.info {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 12px;
}

.empty {
    color: #9eaaa3;
    font-size: 12px;
    padding: 10px;
}

@media(max-width: 700px) {
    .browser {
        width: 100%;
        margin: 0;
        border-radius: 0;
        padding: 11px;
        min-height: 100vh;
    }

    .toolbar {
        flex-wrap: wrap;
    }

    .navigation {
        width: 100%;
    }

    .toolbar input {
        flex-basis: calc(100% - 60px);
    }

    .toolbar > #goBtn {
        flex: 1;
    }

    .header h2 {
        font-size: 18px;
    }

    .tab {
        min-width: 105px;
    }

    .startpage h1 {
        font-size: 27px;
    }

    iframe {
        height: 70vh;
        min-height: 400px;
    }
}
</style>
</head>

<body>
<div class="browser">

    <div class="header">
        <div class="brand">
            <span style="font-size:23px">🌐</span>
            <h2>VANTA Browser</h2>
        </div>
        <span class="version">VERSION 0.2</span>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="toolbar">
        <div class="navigation">
            <button class="iconbtn" id="backBtn" onclick="goBack()" title="Wstecz">←</button>
            <button class="iconbtn" id="forwardBtn" onclick="goForward()" title="Dalej">→</button>
            <button class="iconbtn" onclick="reloadPage()" title="Odśwież">↻</button>
            <button class="iconbtn" onclick="showHome()" title="Strona startowa">⌂</button>
        </div>

        <input id="address" type="text"
            placeholder="Wpisz adres lub wyszukaj..."
            autocomplete="off" spellcheck="false">

        <button id="goBtn" onclick="go()">GO</button>
    </div>

    <div class="tools">
        <button onclick="togglePanel('bookmarksPanel')">★ Zakładki</button>
        <button onclick="togglePanel('historyPanel')">◷ Historia</button>
        <button onclick="bookmarkCurrent()">＋ Dodaj zakładkę</button>
        <button onclick="exportBookmarks()">Eksport zakładek</button>
        <button onclick="document.getElementById('importFile').click()">Import zakładek</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>

    <div class="panel" id="bookmarksPanel">
        <div class="panel-head">
            <strong>★ Zapisane zakładki</strong>
            <div class="panel-actions">
                <button class="secondary" onclick="togglePanel('bookmarksPanel')">Zamknij</button>
            </div>
        </div>
        <div class="list" id="bookmarksList"></div>
    </div>

    <div class="panel" id="historyPanel">
        <div class="panel-head">
            <strong>◷ Historia przeglądania</strong>
            <div class="panel-actions">
                <button class="secondary" onclick="clearHistory()">Wyczyść historię</button>
                <button class="secondary" onclick="togglePanel('historyPanel')">Zamknij</button>
            </div>
        </div>
        <input class="panel-search" id="historySearch"
            placeholder="Szukaj w historii..." oninput="renderHistory()">
        <div class="list" id="historyList"></div>
    </div>

    <div class="status">
        <span id="status">Gotowy</span>
        <span id="counter">0 odwiedzin</span>
    </div>

    <div class="progress">
        <span id="progressBar"></span>
    </div>

    <div class="viewer">
        <div class="startpage show" id="startpage">
            <h1>VANTA</h1>
            <p>YOUR WINDOW TO THE WEB</p>

            <form class="start-search" id="startForm">
                <input id="startInput" placeholder="Szukaj w Google lub wpisz adres...">
                <button>Szukaj</button>
            </form>

            <div class="tiles" id="tiles"></div>
        </div>

        <iframe id="page" title="VANTA Browser"
            allow="fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"
            style="display:none"></iframe>
    </div>

    <div class="info">
        VANTA Browser v0.2 · Eksperymentalny interfejs oparty na iframe.<br>
        Niektóre witryny blokują osadzanie. Karty, historia i zakładki
        są przechowywane lokalnie w tej przeglądarce.
    </div>

</div>

<script>
const $ = id => document.getElementById(id);
const address = $('address');
const page = $('page');

const STORAGE = {
    history: 'vanta_v02_history',
    bookmarks: 'vanta_v02_bookmarks',
    tabs: 'vanta_v02_tabs',
    active: 'vanta_v02_active'
};

let historyEntries = loadJSON(STORAGE.history, []);
let bookmarks = loadJSON(STORAGE.bookmarks, []);
let tabs = loadJSON(STORAGE.tabs, []);
let activeTabId = localStorage.getItem(STORAGE.active);
let tabSerial = 0;
let loadingTimer = null;

function loadJSON(key, fallback) {
    try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : fallback;
    } catch {
        return fallback;
    }
}

function persist() {
    localStorage.setItem(STORAGE.history, JSON.stringify(historyEntries));
    localStorage.setItem(STORAGE.bookmarks, JSON.stringify(bookmarks));
    localStorage.setItem(STORAGE.tabs, JSON.stringify(tabs));
    localStorage.setItem(STORAGE.active, activeTabId || '');
}

function makeId() {
    return 't' + Date.now().toString(36) + (++tabSerial).toString(36);
}

function activeTab() {
    return tabs.find(t => t.id === activeTabId);
}

function normalizeAddress(value) {
    value = String(value || '').trim();

    if (!value) return null;

    if (/\s/.test(value) ||
        (!value.includes('.') && !/^https?:\/\//i.test(value))) {
        return 'https://www.google.com/search?q=' +
            encodeURIComponent(value);
    }

    if (!/^https?:\/\//i.test(value)) {
        value = 'https://' + value;
    }

    try {
        const parsed = new URL(value);

        return ['http:', 'https:'].includes(parsed.protocol)
            ? parsed.href
            : null;
    } catch {
        return null;
    }
}

function pageTitle(url) {
    try {
        return new URL(url).hostname.replace(/^www\./, '');
    } catch {
        return 'Nowa karta';
    }
}

function createTab(url = '') {
    const tab = {
        id: makeId(),
        url,
        back: [],
        forward: []
    };

    tabs.push(tab);
    activeTabId = tab.id;

    persist();
    renderTabs();

    if (url) navigate(url);
    else showHome();
}

function closeTab(id) {
    const index = tabs.findIndex(t => t.id === id);

    if (index < 0) return;

    tabs.splice(index, 1);

    if (!tabs.length) {
        createTab('');
        return;
    }

    if (activeTabId === id) {
        activeTabId = tabs[Math.max(0, index - 1)].id;
        persist();
        renderTabs();
        displayActiveTab();
    } else {
        persist();
        renderTabs();
    }
}

function switchTab(id) {
    if (id === activeTabId) return;

    activeTabId = id;
    persist();
    renderTabs();
    displayActiveTab();
}

function renderTabs() {
    const root = $('tabs');
    root.innerHTML = '';

    tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' +
            (tab.id === activeTabId ? ' active' : '');

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = tab.url
            ? pageTitle(tab.url)
            : 'Nowa karta';

        title.onclick = () => switchTab(tab.id);

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.title = 'Zamknij kartę';

        close.onclick = e => {
            e.stopPropagation();
            closeTab(tab.id);
        };

        el.append(title, close);
        el.onclick = () => switchTab(tab.id);
        root.appendChild(el);
    });

    const add = document.createElement('button');
    add.className = 'new-tab';
    add.textContent = '+';
    add.title = 'Nowa karta';
    add.onclick = () => createTab('');

    root.appendChild(add);
}

function displayActiveTab() {
    const tab = activeTab();

    if (!tab) return;

    if (tab.url) {
        address.value = tab.url;
        $('startpage').classList.remove('show');
        $('startpage').style.display = 'none';
        page.style.display = 'block';
        page.src = tab.url;
        $('status').textContent = 'Karta przywrócona';
    } else {
        showHome();
    }

    updateNav();
}

function showHome() {
    const tab = activeTab();

    if (tab) tab.url = '';

    address.value = '';
    page.style.display = 'none';
    $('startpage').style.display = 'block';
    $('startpage').classList.add('show');

    $('status').textContent = 'Strona startowa';

    updateNav();
    persist();
    renderTiles();
}

function navigate(input, options = {}) {
    const url = normalizeAddress(input);

    if (!url) {
        $('status').textContent = 'Nieprawidłowy adres';
        return;
    }

    let tab = activeTab();

    if (!tab) {
        createTab('');
        tab = activeTab();
    }

    if (tab.url && tab.url !== url && options.history !== false) {
        tab.back.push(tab.url);
        tab.forward = [];
    }

    tab.url = url;
    address.value = url;

    $('startpage').classList.remove('show');
    $('startpage').style.display = 'none';
    page.style.display = 'block';

    $('status').textContent = 'Ładowanie…';
    $('progressBar').style.width = '35%';

    clearTimeout(loadingTimer);

    loadingTimer = setTimeout(() => {
        $('progressBar').style.width = '75%';
    }, 500);

    page.src = url;

    if (options.history !== false) {
        historyEntries.push({
            url,
            time: Date.now()
        });

        if (historyEntries.length > 300) {
            historyEntries = historyEntries.slice(-300);
        }
    }

    persist();
    renderTabs();
    updateNav();
    updateCounter();
    renderHistory();
}

function go() {
    navigate(address.value);
}

function reloadPage() {
    const tab = activeTab();

    if (!tab || !tab.url) return;

    $('status').textContent = 'Odświeżanie…';
    $('progressBar').style.width = '25%';

    page.src = tab.url;
}

function goBack() {
    const tab = activeTab();

    if (!tab || !tab.back.length) return;

    tab.forward.push(tab.url);
    tab.url = tab.back.pop();

    navigate(tab.url, { history: false });
    persist();
}

function goForward() {
    const tab = activeTab();

    if (!tab || !tab.forward.length) return;

    tab.back.push(tab.url);
    tab.url = tab.forward.pop();

    navigate(tab.url, { history: false });
    persist();
}

function updateNav() {
    const tab = activeTab();

    $('backBtn').disabled = !tab || !tab.back.length;
    $('forwardBtn').disabled = !tab || !tab.forward.length;
}

function updateCounter() {
    $('counter').textContent =
        historyEntries.length + ' odwiedzin';
}

function togglePanel(id) {
    $(id).classList.toggle('show');

    if (id === 'historyPanel') renderHistory();
    if (id === 'bookmarksPanel') renderBookmarks();
}

function addBookmark(url, name) {
    if (!url) return;

    if (bookmarks.some(b => b.url === url)) {
        $('status').textContent =
            'Ta strona jest już w zakładkach';
        return;
    }

    bookmarks.unshift({
        url,
        name: name || pageTitle(url)
    });

    bookmarks = bookmarks.slice(0, 200);

    persist();
    renderBookmarks();

    $('status').textContent = 'Dodano zakładkę';
}

function bookmarkCurrent() {
    const tab = activeTab();

    if (tab && tab.url) {
        addBookmark(tab.url);
    }
}

function renderBookmarks() {
    const root = $('bookmarksList');
    root.innerHTML = '';

    if (!bookmarks.length) {
        root.innerHTML =
            '<div class="empty">Brak zapisanych zakładek.</div>';
        return;
    }

    bookmarks.forEach((b, i) => {
        const row = document.createElement('div');
        row.className = 'list-item';

        const label = document.createElement('span');
        label.className = 'item-url';
        label.textContent = b.name + ' — ' + b.url;

        const open = document.createElement('button');
        open.textContent = 'Otwórz';

        open.onclick = () => {
            navigate(b.url);
            $('bookmarksPanel').classList.remove('show');
        };

        const del = document.createElement('button');
        del.textContent = 'Usuń';
        del.className = 'secondary';

        del.onclick = () => {
            bookmarks.splice(i, 1);
            persist();
            renderBookmarks();
        };

        row.append(label, open, del);
        root.appendChild(row);
    });
}

function renderHistory() {
    const root = $('historyList');
    root.innerHTML = '';

    const query = ($('historySearch').value || '').toLowerCase();

    const items = historyEntries.slice().reverse()
        .filter(x => x.url.toLowerCase().includes(query));

    if (!items.length) {
        root.innerHTML =
            '<div class="empty">Brak pasujących wpisów.</div>';
        return;
    }

    items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'list-item';

        const label = document.createElement('span');
        label.className = 'item-url';

        label.textContent =
            new Date(item.time).toLocaleString() +
            ' — ' + item.url;

        const open = document.createElement('button');
        open.textContent = 'Otwórz';

        open.onclick = () => {
            navigate(item.url);
            $('historyPanel').classList.remove('show');
        };

        row.append(label, open);
        root.appendChild(row);
    });
}

function clearHistory() {
    if (!confirm('Wyczyścić całą historię VANTA?')) return;

    historyEntries = [];

    persist();
    renderHistory();
    updateCounter();
}

function renderTiles() {
    const root = $('tiles');
    root.innerHTML = '';

    const items = bookmarks.slice(0, 8);

    if (!items.length) {
        const defaults = [
            ['GitHub', 'https://github.com'],
            ['Wikipedia', 'https://wikipedia.org'],
            ['Reddit', 'https://reddit.com'],
            ['Example', 'https://example.com']
        ];

        defaults.forEach(([name, url]) => {
            const tile = document.createElement('button');
            tile.className = 'tile';
            tile.textContent = '✦';

            const span = document.createElement('span');
            span.textContent = name;

            tile.appendChild(span);
            tile.onclick = () => navigate(url);

            root.appendChild(tile);
        });

        return;
    }

    items.forEach(b => {
        const tile = document.createElement('button');
        tile.className = 'tile';
        tile.textContent = '✦';

        const span = document.createElement('span');
        span.textContent = b.name;

        tile.appendChild(span);
        tile.onclick = () => navigate(b.url);

        root.appendChild(tile);
    });
}

function exportBookmarks() {
    const blob = new Blob(
        [JSON.stringify(bookmarks, null, 2)],
        { type: 'application/json' }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'vanta-bookmarks.json';
    a.click();

    URL.revokeObjectURL(url);
}

$('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];

    if (!file) return;

    try {
        const data = JSON.parse(await file.text());

        if (!Array.isArray(data)) throw new Error();

        data.forEach(b => {
            if (
                b &&
                typeof b.url === 'string' &&
                normalizeAddress(b.url) &&
                !bookmarks.some(x => x.url === b.url)
            ) {
                bookmarks.push({
                    url: normalizeAddress(b.url),
                    name: String(b.name || pageTitle(b.url))
                });
            }
        });

        persist();
        renderBookmarks();
        renderTiles();

        $('status').textContent = 'Zaimportowano zakładki';
    } catch {
        $('status').textContent = 'Nie udało się odczytać pliku';
    }

    e.target.value = '';
});

$('startForm').addEventListener('submit', e => {
    e.preventDefault();
    navigate($('startInput').value);
});

address.addEventListener('keydown', e => {
    if (e.key === 'Enter') go();
});

document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        createTab('');
    }

    if (e.ctrlKey && e.key.toLowerCase() === 'w') {
        e.preventDefault();
        closeTab(activeTabId);
    }

    if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        address.focus();
        address.select();
    }

    if (e.altKey && e.key === 'ArrowLeft') {
        e.preventDefault();
        goBack();
    }

    if (e.altKey && e.key === 'ArrowRight') {
        e.preventDefault();
        goForward();
    }
});

page.addEventListener('load', () => {
    clearTimeout(loadingTimer);

    $('progressBar').style.width = '100%';

    $('status').textContent =
        'Załadowano · osadzanie może być zablokowane przez witrynę';

    setTimeout(() => {
        $('progressBar').style.width = '0%';
    }, 700);
});

if (!tabs.length) {
    tabs = [{
        id: makeId(),
        url: '',
        back: [],
        forward: []
    }];

    activeTabId = tabs[0].id;
}

if (!tabs.some(t => t.id === activeTabId)) {
    activeTabId = tabs[0].id;
}

persist();
renderTabs();
renderBookmarks();
renderTiles();
updateCounter();
updateNav();
displayActiveTab();
</script>
</body>
</html>
