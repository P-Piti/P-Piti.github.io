<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Clicks Challenge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for victory celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Custom glow & shadow effects */
        .red-btn {
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transition: transform 0.05s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .red-btn:hover {
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #ff3b3b 0%, #cc0000 100%);
        }

        .red-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), inset 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* Counter Text Glow */
        .counter-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Click Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.4s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* Modal scale animation */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-modal {
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Floating +1 Floating Animation */
        .floating-num {
            position: absolute;
            color: #ff4d4d;
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between items-center relative overflow-hidden">

    <!-- Top Counter Section -->
    <header class="w-full pt-10 pb-4 flex flex-col items-center justify-center z-10">
        <span class="text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Total Clicks</span>
        <div class="flex items-baseline space-x-2">
            <span id="counter" class="text-7xl font-black text-white counter-glow tracking-tight">0</span>
            <span class="text-2xl font-bold text-gray-500">/ 100</span>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-64 sm:w-80 h-3 bg-gray-900 rounded-full mt-4 p-0.5 border border-gray-800 overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-red-700 to-red-500 rounded-full transition-all duration-150 ease-out" style="width: 0%;"></div>
        </div>
    </header>

    <!-- Main Button Area -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full z-10">
        <div class="relative flex items-center justify-center">
            <!-- Pulsing aura rings -->
            <div id="aura" class="absolute w-56 h-56 sm:w-72 sm:h-72 rounded-full bg-red-600/20 blur-xl transition-all duration-300"></div>

            <!-- Main Red Clicker Button -->
            <button id="click-btn" class="red-btn relative w-48 h-48 sm:w-64 sm:h-64 rounded-full flex flex-col items-center justify-center outline-none cursor-pointer border-4 border-red-400/30 overflow-hidden group">
                <i class="fa-solid fa-hand-pointer text-4xl sm:text-5xl text-white/90 group-hover:scale-110 transition-transform duration-200"></i>
                <span class="mt-2 text-sm sm:text-base font-bold uppercase tracking-wider text-white/80">Click Me!</span>
            </button>
        </div>
    </main>

    <!-- Footer Info -->
    <footer class="pb-6 text-xs text-gray-600 z-10">
        Reach 100 clicks to unlock the prize!
    </footer>

    <!-- Celebration Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl relative animate-modal">
            
            <!-- Victory Image Container -->
            <div class="relative w-full h-48 sm:h-56 rounded-2xl overflow-hidden mb-5 border border-gray-700">
                <img id="victory-image" 
                     src="https://placehold.co/600x400/dc2626/ffffff?text=VICTORY!+100+CLICKS" 
                     alt="Victory Celebration" 
                     class="w-full h-full object-cover"
                     onerror="this.onerror=null; this.src='https://placehold.co/600x400/991b1b/ffffff?text=Achievement+Unlocked!';" />
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent opacity-60"></div>
                <div class="absolute top-3 right-3 bg-red-600 text-white text-xs font-black uppercase px-3 py-1 rounded-full shadow-lg">
                    Goal Reached!
                </div>
            </div>

            <!-- Victory Content -->
            <h2 class="text-3xl font-black text-white mb-2">Target Achieved! 🎉</h2>
            <p class="text-gray-400 text-sm mb-6">
                You clicked the red button <span class="text-red-500 font-bold">100 times</span>! Your dedication and speed are impressive.
            </p>

            <!-- Modal Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button id="reset-btn" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-xl transition duration-150 shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-rotate-right mr-2"></i>Play Again
                </button>
                <button id="continue-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold py-3 px-6 rounded-xl border border-gray-700 transition duration-150">
                    Keep Clicking
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const counterEl = document.getElementById('counter');
        const progressBar = document.getElementById('progress-bar');
        const clickBtn = document.getElementById('click-btn');
        const aura = document.getElementById('aura');
        const victoryModal = document.getElementById('victory-modal');
        const resetBtn = document.getElementById('reset-btn');
        const continueBtn = document.getElementById('continue-btn');
        const victoryImage = document.getElementById('victory-image');

        // Game State Variables
        let count = 0;
        const TARGET_GOAL = 100;
        let milestoneReached = false;

        // Sound Synthesis using Web Audio API (No external sound files required)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Frequency rises slightly with progress
            const baseFreq = 300 + (count * 2);
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq / 2, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playVictorySound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);

                gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.3);
            });
        }

        // Handle Click Event
        function handleClick(e) {
            count++;
            
            // Update DOM Counter & Progress Bar
            counterEl.textContent = count;
            const progressPercent = Math.min((count / TARGET_GOAL) * 100, 100);
            progressBar.style.width = `${progressPercent}%`;

            // Play Audio Feedback
            try {
                playClickSound();
            } catch (err) {
                // Fallback gracefully if Web Audio is restricted
            }

            // Visual Effects (Ripple & Floating +1)
            createRipple(e);
            createFloatingNumber(e);

            // Dynamically scale aura effect based on click count progress
            const auraScale = 1 + (count / TARGET_GOAL) * 0.5;
            aura.style.transform = `scale(${auraScale})`;

            // Check for Milestone (100 Clicks)
            if (count === TARGET_GOAL && !milestoneReached) {
                milestoneReached = true;
                triggerVictory();
            }
        }

        // Ripple Effect on Button
        function createRipple(e) {
            const rect = clickBtn.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            // Get position relative to button (support both touch and click)
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height / 2);

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size / 2}px`;
            ripple.style.top = `${y - size / 2}px`;

            clickBtn.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 400);
        }

        // Floating "+1" Animation on Click Location
        function createFloatingNumber(e) {
            const num = document.createElement('span');
            num.classList.add('floating-num');
            num.textContent = '+1';

            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || (window.innerWidth / 2);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || (window.innerHeight / 2);

            // Add slight randomness to X position for organic look
            const randomXOffset = (Math.random() - 0.5) * 30;
            num.style.left = `${clientX + randomXOffset}px`;
            num.style.top = `${clientY - 20}px`;

            document.body.appendChild(num);

            setTimeout(() => {
                num.remove();
            }, 700);
        }

        // Trigger Victory Celebration
        function triggerVictory() {
            // Sound
            try {
                playVictorySound();
            } catch (err) {}

            // Confetti Burst
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                // Secondary continuous confetti burst for 2 seconds
                const duration = 2 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 3,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });
                    confetti({
                        particleCount: 3,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            }

            // Set high quality dynamic celebration image fallback
            victoryImage.src = `https://tinyurl.com/2v9mzxad`;

            // Display Modal after brief delay for natural rhythm
            setTimeout(() => {
                victoryModal.classList.remove('hidden');
            }, 250);
        }

        // Reset Game
        function resetGame() {
            count = 0;
            milestoneReached = false;
            counterEl.textContent = count;
            progressBar.style.width = '0%';
            aura.style.transform = 'scale(1)';
            victoryModal.classList.add('hidden');
        }

        // Event Listeners
        clickBtn.addEventListener('click', handleClick);
        
        // Touch support optimization
        clickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevents double firing click on mobile
            handleClick(e);
        }, { passive: false });

        resetBtn.addEventListener('click', resetGame);
        
        continueBtn.addEventListener('click', () => {
            victoryModal.classList.add('hidden');
        });
    </script>
</body>
</html>
