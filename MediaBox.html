/* ============================================================
   5. Player
   ============================================================ */
let activePlayer = null;
const urlCache = new Map();

const MediaStore = (function () {
  let dbp = null;
  function open() {
    if (!window.indexedDB) return Promise.reject(new Error("no-idb"));
    if (!dbp) {
      dbp = new Promise(function (res, rej) {
        const req = indexedDB.open("mediabox-media", 1);
        req.onupgradeneeded = function () {
          const d = req.result;
          if (!d.objectStoreNames.contains("files")) d.createObjectStore("files");
        };
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { rej(req.error); };
      });
    }
    return dbp;
  }
  function run(mode, fn) {
    return open().then(function (d) {
      return new Promise(function (res, rej) {
        const tx = d.transaction("files", mode);
        let out;
        const req = fn(tx.objectStore("files"));
        if (req) req.onsuccess = function () { out = req.result; };
        tx.oncomplete = function () { res(out); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  return {
    put: function (key, blob) { return run("readwrite", function (s) { return s.put(blob, key); }); },
    get: function (key) { return run("readonly", function (s) { return s.get(key); }); },
    del: function (key) { return run("readwrite", function (s) { return s.delete(key); }); }
  };
})();

function mediaUrl(id) {
  if (!id) return Promise.resolve(null);
  if (urlCache.has(id)) return Promise.resolve(urlCache.get(id));
  return MediaStore.get(id).then(function (blob) {
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    urlCache.set(id, u);
    return u;
  }).catch(function () { return null; });
}

function mountPlayer(host, video) {
  if (activePlayer) { activePlayer.destroy(); activePlayer = null; }
  const isDemo = !!(video.demo && !video.mediaId);
  const initialDur = video.duration || 60;
  host.innerHTML =
    '<div class="player" tabindex="0" role="region" aria-label="Video player: ' + esc(video.title) + '">' +
      '<div class="p-stage"></div>' +
      '<div class="p-center"><button class="p-bigplay" type="button" aria-label="Play video">' + I.play + "</button></div>" +
      '<div class="p-badge" title="' + (isDemo ? "Demo clips are generated in your browser. They are silent." : "Uploaded video, stored in your browser") + '"><span class="dot"></span>' + (isDemo ? "DEMO CLIP" : "UPLOAD") + "</div>" +
      '<div class="p-loader"><div class="spinner"></div></div>' +
      '<div class="p-bar">' +
        '<div class="p-track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
          '<div class="p-buffer"></div><div class="p-fill"></div><div class="p-knob"></div>' +
        "</div>" +
        '<div class="p-row">' +
          '<button class="p-btn" type="button" data-p="play" aria-label="Play">' + I.play + "</button>" +
          (isDemo ? "" :
            '<div class="p-volwrap"><button class="p-btn" type="button" data-p="mute" aria-label="Mute">' + I.volume + "</button>" +
            '<div class="p-vol"><div class="p-vol-track"><div class="p-vol-fill"></div></div></div></div>') +
          '<span class="p-time">0:00 <span class="sep">/</span> ' + fmtDur(initialDur) + "</span>" +
          '<span class="p-spacer"></span>' +
          '<div class="p-rate"><button class="p-rate-btn" type="button" data-p="rate" aria-haspopup="true" aria-expanded="false" aria-label="Playback speed">1×</button>' +
            '<div class="p-rate-menu">' + [0.5, 0.75, 1, 1.25, 1.5, 2].map(function (r) {
              return '<button type="button" data-rate="' + r + '" class="' + (r === 1 ? "on" : "") + '">' + r + "×" + (r === 1 ? " <span>✓</span>" : "") + "</button>";
            }).join("") + "</div></div>" +
          '<button class="p-btn" type="button" data-p="fs" aria-label="Fullscreen">' + I.fullscreen + "</button>" +
        "</div>" +
      "</div>" +
    "</div>";

  const playerEl = $(".player", host);
  const stage = $(".p-stage", playerEl);
  const track = $(".p-track", playerEl);
  const fillEl = $(".p-fill", playerEl);
  const bufEl = $(".p-buffer", playerEl);
  const knob = $(".p-knob", playerEl);
  const timeEl = $(".p-time", playerEl);
  const playBtn = $('[data-p="play"]', playerEl);
  const bigPlay = $(".p-bigplay", playerEl);
  const loader = $(".p-loader", playerEl);
  const rateMenu = $(".p-rate-menu", playerEl);
  const rateBtn = $("[data-p=rate]", playerEl);

  let ad = null, hideTimer = 0, destroyed = false, hasStarted = false;
  let volume = 1, muted = false, rate = 1;

  function sync() {
    if (destroyed || !ad) return;
    const cur = ad.current(), dur = ad.duration() || 0;
    const pct = dur ? clamp(cur / dur, 0, 1) * 100 : 0;
    fillEl.style.width = pct + "%";
    knob.style.left = pct + "%";
    track.setAttribute("aria-valuenow", String(Math.round(pct)));
    timeEl.innerHTML = fmtDur(cur) + ' <span class="sep">/</span> ' + fmtDur(dur);
    const playing = ad.isPlaying();
    playerEl.classList.toggle("playing", playing);
    playBtn.innerHTML = playing ? I.pause : I.play;
    playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    bigPlay.innerHTML = playing ? I.pause : I.play;
  }
  function showUI() {
    playerEl.classList.remove("hide-ui");
    clearTimeout(hideTimer);
    if (ad && ad.isPlaying()) hideTimer = setTimeout(function () { playerEl.classList.add("hide-ui"); }, 2600);
  }
  function toggle() {
    if (!ad) return;
    if (!hasStarted) { hasStarted = true; loader.classList.add("done"); }
    if (ad.isPlaying()) ad.pause(); else ad.play();
    sync(); showUI();
  }
  function seekTo(sec) {
    if (!ad) return;
    ad.seek(clamp(sec, 0, ad.duration() || 0));
    sync();
  }
  function setRate(r) {
    rate = r;
    if (ad) ad.setRate(r);
    rateBtn.textContent = (r === 1 ? "1" : String(r)) + "×";
    $$("button[data-rate]", rateMenu).forEach(function (b) { b.classList.toggle("on", Number(b.dataset.rate) === r); });
    rateMenu.classList.remove("open");
    rateBtn.setAttribute("aria-expanded", "false");
  }
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement === playerEl) {
        const p = document.exitFullscreen && document.exitFullscreen();
        if (p && p.catch) p.catch(function () {});
      } else if (playerEl.requestFullscreen) {
        const p = playerEl.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }
  function onFsChange() {
    $('[data-p="fs"]', playerEl).innerHTML = document.fullscreenElement === playerEl ? I.exitFs : I.fullscreen;
  }

  /* ----- adapters ----- */
  if (isDemo) {
    const canvas = document.createElement("canvas");
    canvas.width = 960;
    canvas.height = 540;
    stage.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    const dur = video.duration || 60;
    let t = 0, playing = false, raf = 0, last = 0, ended = false;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.max(320, Math.round((rect.width || 960) * dpr));
      const h = Math.max(180, Math.round((rect.height || 540) * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        if (!playing) drawDemo(ctx, canvas.width, canvas.height, t, video.demo.hue, video.demo.mode, video.title);
      }
    }
    const ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
    if (ro) ro.observe(canvas);
    resize();

    function frame(ts) {
      if (!playing || destroyed) return;
      const dt = last ? (ts - last) / 1000 : 0;
      last = ts;
      t = Math.min(dur, t + dt * rate);
      drawDemo(ctx, canvas.width, canvas.height, t, video.demo.hue, video.demo.mode, video.title);
      sync();
      if (t >= dur) { playing = false; ended = true; sync(); showUI(); return; }
      raf = requestAnimationFrame(frame);
    }
    drawDemo(ctx, canvas.width, canvas.height, 0, video.demo.hue, video.demo.mode, video.title);
    loader.classList.add("done");

    ad = {
      current: function () { return t; },
      duration: function () { return dur; },
      isPlaying: function () { return playing; },
      play: function () { if (t >= dur) t = 0; playing = true; ended = false; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
      pause: function () { playing = false; cancelAnimationFrame(raf); drawDemo(ctx, canvas.width, canvas.height, t, video.demo.hue, video.demo.mode, video.title); },
      seek: function (s) { t = clamp(s, 0, dur); drawDemo(ctx, canvas.width, canvas.height, t, video.demo.hue, video.demo.mode, video.title); },
      setRate: function (r) { rate = r; },
      setVolume: function () {},
      toggleMute: function () {},
      destroy: function () { playing = false; cancelAnimationFrame(raf); if (ro) ro.disconnect(); }
    };
  } else {
    const vid = document.createElement("video");
    vid.playsInline = true;
    vid.preload = "metadata";
    vid.setAttribute("playsinline", "");
    stage.appendChild(vid);
    let vidDur = initialDur;

    vid.addEventListener("loadedmetadata", function () {
      if (isFinite(vid.duration) && vid.duration > 0) {
        vidDur = vid.duration;
        if (Math.abs((video.duration || 0) - vidDur) > 1) { video.duration = Math.round(vidDur); saveDb(); }
      }
      loader.classList.add("done");
      sync();
    });
    vid.addEventListener("timeupdate", sync);
    vid.addEventListener("play", sync);
    vid.addEventListener("pause", sync);
    vid.addEventListener("ended", function () { sync(); showUI(); });
    vid.addEventListener("progress", function () {
      try {
        if (vid.buffered.length && vidDur) bufEl.style.width = (vid.buffered.end(vid.buffered.length - 1) / vidDur * 100) + "%";
      } catch (e) {}
    });
    vid.addEventListener("error", function () {
      if (loader) loader.classList.add("done");
      const err = document.createElement("div");
      err.className = "p-err";
      err.innerHTML = "<div><b>This video file could not be played</b>The upload may have been removed from browser storage. Try uploading it again.</div>";
      playerEl.appendChild(err);
    });
    mediaUrl(video.mediaId).then(function (u) {
      if (destroyed) return;
      if (!u) {
        loader.classList.add("done");
        const err = document.createElement("div");
        err.className = "p-err";
        err.innerHTML = "<div><b>Media missing</b>This upload is no longer in browser storage. You can remove the entry or upload the file again.</div>";
        playerEl.appendChild(err);
        return;
      }
      vid.src = u;
      vid.volume = volume;
      vid.playbackRate = rate;
      vid.load();
    });

    ad = {
      current: function () { return vid.currentTime || 0; },
      duration: function () { return vidDur || 0; },
      isPlaying: function () { return !vid.paused && !vid.ended; },
      play: function () { const p = vid.play(); if (p && p.catch) p.catch(function () {}); },
      pause: function () { vid.pause(); },
      seek: function (s) { try { vid.currentTime = clamp(s, 0, vidDur || s); } catch (e) {} },
      setRate: function (r) { try { vid.playbackRate = r; } catch (e) {} },
      setVolume: function (v) { volume = v; vid.volume = v; vid.muted = muted; },
      toggleMute: function () { muted = !muted; vid.muted = muted; $('[data-p="mute"]', playerEl).innerHTML = muted || vid.volume === 0 ? I.mute : I.volume; },
      destroy: function () { try { vid.pause(); vid.removeAttribute("src"); vid.load(); } catch (e) {} }
    };
  }

  /* ----- controls ----- */
  if (bigPlay) bigPlay.addEventListener("click", function (e) { e.stopPropagation(); toggle(); });
  playBtn.addEventListener("click", toggle);
  stage.addEventListener("click", toggle);
  playerEl.addEventListener("pointermove", showUI);
  playerEl.addEventListener("pointerdown", showUI);
  playerEl.addEventListener("mouseleave", function () {
    if (ad && ad.isPlaying()) playerEl.classList.add("hide-ui");
  });

  function seekFromEvent(e) {
    const r = track.getBoundingClientRect();
    const ratio = clamp((e.clientX - r.left) / r.width, 0, 1);
    seekTo(ratio * (ad.duration() || 0));
  }
  let dragging = false;
  track.addEventListener("pointerdown", function (e) {
    if (!ad) return;
    dragging = true;
    track.setPointerCapture && track.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  track.addEventListener("pointermove", function (e) { if (dragging) seekFromEvent(e); });
  track.addEventListener("pointerup", function () { dragging = false; });
  track.addEventListener("pointercancel", function () { dragging = false; });
  track.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); seekTo(ad.current() + 5); }
    if (e.key === "ArrowLeft") { e.preventDefault(); seekTo(ad.current() - 5); }
  });

  const muteBtn = $('[data-p="mute"]', playerEl);
  if (muteBtn) muteBtn.addEventListener("click", function () { ad.toggleMute(); sync(); });
  const volTrack = $(".p-vol-track", playerEl);
  let onVolUp = null;
  if (volTrack) {
    let vdrag = false;
    const setVol = function (e) {
      const r = volTrack.getBoundingClientRect();
      const v = clamp((e.clientX - r.left) / r.width, 0, 1);
      $(".p-vol-fill", playerEl).style.width = (v * 100) + "%";
      muted = v === 0;
      ad.setVolume(v);
      if (muteBtn) muteBtn.innerHTML = v === 0 ? I.mute : I.volume;
    };
    volTrack.addEventListener("pointerdown", function (e) { vdrag = true; setVol(e); });
    volTrack.addEventListener("pointermove", function (e) { if (vdrag) setVol(e); });
    onVolUp = function () { vdrag = false; };
    window.addEventListener("pointerup", onVolUp);
  }

  rateBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    const open = rateMenu.classList.toggle("open");
    rateBtn.setAttribute("aria-expanded", String(open));
  });
  rateMenu.addEventListener("click", function (e) {
    const b = e.target.closest("[data-rate]");
    if (b) setRate(Number(b.dataset.rate));
  });
  $('[data-p="fs"]', playerEl).addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", onFsChange);

  playerEl.addEventListener("keydown", function (e) {
    if (!ad) return;
    const onButton = e.target.closest("button");
    if (e.key === " " || e.key === "k" || e.key === "K") {
      if (onButton && e.key === " ") return;
      e.preventDefault(); toggle();
    } else if (e.key === "ArrowRight") { e.preventDefault(); seekTo(ad.current() + 5); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seekTo(ad.current() - 5); }
    else if (e.key === "m" || e.key === "M") { if (!isDemo) { ad.toggleMute(); sync(); } }
    else if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFullscreen(); }
    else if (e.key === "ArrowUp" && !isDemo) { e.preventDefault(); ad.setVolume(clamp(volume + 0.1, 0, 1)); }
    else if (e.key === "ArrowDown" && !isDemo) { e.preventDefault(); ad.setVolume(clamp(volume - 0.1, 0, 1)); }
  });

  const onDocPointerDown = function (e) {
    if (!rateMenu.classList.contains("open")) return;
    if (!e.target.closest(".p-rate")) {
      rateMenu.classList.remove("open");
      rateBtn.setAttribute("aria-expanded", "false");
    }
  };
  document.addEventListener("pointerdown", onDocPointerDown);

  activePlayer = {
    destroy: function () {
      destroyed = true;
      clearTimeout(hideTimer);
      document.removeEventListener("fullscreenchange", onFsChange);
      document.removeEventListener("pointerdown", onDocPointerDown);
      if (onVolUp) window.removeEventListener("pointerup", onVolUp);
      try {
        if (document.fullscreenElement === playerEl && document.exitFullscreen) {
          const p = document.exitFullscreen();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
      if (ad && ad.destroy) ad.destroy();
      if (activePlayer === this) activePlayer = null;
    }
  };
  sync();
  return activePlayer;
}

/* ============================================================
   6. Routing
   ============================================================ */
const state = { category: "All" };
const seenViews = (function () {
  try { return new Set(JSON.parse(sessionStorage.getItem("mediabox:seen") || "[]")); }
  catch (e) { return new Set(); }
})();

function currentRoute() {
  let raw = (location.hash || "").replace(/^#/, "");
  if (!raw) raw = "/";
  const qi = raw.indexOf("?");
  const path = qi >= 0 ? raw.slice(0, qi) : raw;
  const qs = qi >= 0 ? raw.slice(qi + 1) : "";
  const parts = path.split("/").filter(Boolean);
  return { raw: raw, path: path || "/", parts: parts, params: new URLSearchParams(qs) };
}
function goto(path) {
  closePop();
  closeSidebar();
  if (("#" + path) === location.hash) render();
  else location.hash = path;
}
function closeSidebar() { document.body.classList.remove("side-open"); }

function bumpView(v) {
  if (seenViews.has(v.id)) return;
  seenViews.add(v.id);
  v.views = (v.views || 0) + 1;
  saveDb();
  try { sessionStorage.setItem("mediabox:seen", JSON.stringify(Array.from(seenViews))); } catch (e) {}
}

function render() {
  closePop();
  if (activePlayer) { activePlayer.destroy(); activePlayer = null; }
  const r = currentRoute();
  renderSidebar();
  syncAccountBtn();
  syncThemeBtn();
  const seg = r.parts[0] || "";
  let out;
  try {
    if (!seg) out = viewHome();
    else if (seg === "watch") out = viewWatch(r.parts[1]);
    else if (seg === "channel") out = viewChannel(r.parts[1], r);
    else if (seg === "playlist") out = viewPlaylist(r.parts[1]);
    else if (seg === "results") out = viewResults(r.params.get("q") || "");
    else if (seg === "library") out = viewLibrary();
    else if (seg === "liked") out = viewLiked();
    else if (seg === "later") out = viewLater();
    else if (seg === "your-videos") out = viewYourVideos();
    else if (seg === "subscriptions") out = viewSubscriptions();
    else out = viewNotFound();
  } catch (err) {
    console.error(err);
    out = { html: '<div class="page">' + emptyState(I.sparkle, "Something went sideways", "A part of the page could not be rendered. Reloading usually helps.", '<button class="btn primary" onclick="location.reload()">Reload</button>') + "</div>", title: "Error" };
  }
  const view = $("#view");
  view.innerHTML = out.html;
  document.title = out.title ? out.title + " — MediaBox" : "MediaBox";
  if (r.parts[0] === "results") {
    const si = $("#search-input");
    if (si) si.value = r.params.get("q") || "";
  }
  paintThumbs(view);
  if (out.mount) out.mount();
  view.focus({ preventScroll: true });
}

/* ============================================================
   7. Views
   ============================================================ */
function setupBanner() {
  if (me() || db.setupDismissed) return "";
  return '<div class="setup"><div class="su-icon">' + I.sparkle + "</div>" +
    '<div class="su-text"><b>Make this place yours</b><p>Create a channel to upload videos, comment and build playlists. Liking, subscribing and Watch later already work without one.</p></div>' +
    '<div class="su-actions"><button class="btn primary" type="button" data-create-channel>Create your channel</button>' +
    '<button class="su-x" type="button" data-dismiss-setup aria-label="Dismiss">' + I.close + "</button></div></div>";
}

function viewHome() {
  const list = allPublic()
    .filter(function (v) { return state.category === "All" || v.category === state.category; })
    .sort(function (a, b) { return b.createdAt - a.createdAt; });
  const chips = CATEGORIES.map(function (c) {
    return '<button class="chip' + (state.category === c ? " active" : "") + '" type="button" data-chip="' + esc(c) + '">' +
      (c === "All" ? 'All' : (c === "Music" ? '<span class="dot"></span>' : "") + esc(c)) + "</button>";
  }).join("");
  const count = allPublic().length;
  const html = '<section class="page">' +
    '<div class="chips" role="tablist" aria-label="Video categories">' + chips + "</div>" +
    setupBanner() +
    '<div class="home-meta"><span>' + (state.category === "All" ? "Latest videos" : state.category + " videos") + "</span><span class=\"line\"></span><span>" + count + " video" + (count === 1 ? "" : "s") + " · " + db.channels.length + " channels</span></div>" +
    (list.length
      ? '<div class="grid">' + list.map(videoCard).join("") + "</div>"
      : emptyState(I.video, "Nothing here yet",
          state.category === "All" ? "The shelf is empty. Upload the first video or pick another category." : "No videos in " + state.category + " yet.",
          me() ? '<button class="btn primary" type="button" data-upload>' + I.upload + "Upload a video</button>"
               : '<button class="btn primary" type="button" data-create-channel>Create a channel</button>')) +
    '<div class="note-strip">MediaBox · a small video platform that lives in one HTML file. Your uploads stay in this browser.</div>' +
    "</section>";
  return { html: html, title: "Home" };
}

function viewWatch(id) {
  const v = videoById(id);
  if (!v || (v.visibility === "private" && !isMine(v))) return viewNotFound("This video is unavailable", "It may have been deleted, or its visibility is set to private.");
  bumpView(v);
  const ch = chById(v.channelId) || { name: "Unknown channel", id: "" };
  const subscribed = isSubscribed(ch);
  const related = allPublic()
    .filter(function (x) { return x.id !== v.id; })
    .map(function (x) { return { x: x, score: (x.category === v.category ? 2 : 0) + (x.channelId === v.channelId ? 1 : 0) }; })
    .sort(function (a, b) { return b.score - a.score || b.x.createdAt - a.x.createdAt; })
    .slice(0, 12).map(function (o) { return o.x; });

  const desc = (v.description || "").trim();
  const html = '<div class="watch">' +
    '<div class="watch-main">' +
      '<div id="player-host"></div>' +
      '<h1 class="w-title">' + esc(v.title) + "</h1>" +
      '<div class="w-top">' +
        '<div class="w-channel">' + avatarLink(ch, "md") +
          '<div><a class="ch-name" href="#/channel/' + esc(ch.id) + '" data-go="/channel/' + esc(ch.id) + '">' + esc(ch.name) +
            (ch.verified ? '<span class="ch-verified" title="Verified">' + I.verified + "</span>" : "") + "</a>" +
            '<div class="ch-sub" data-subs>' + fmtCount(subCount(ch)) + " subscribers</div></div>" +
          '<button class="btn ' + (subscribed ? "" : "primary") + ' sm" type="button" data-subscribe="' + esc(ch.id) + '" style="margin-left:6px">' + (subscribed ? "Subscribed" : "Subscribe") + "</button>" +
        "</div>" +
        '<div class="w-actions">' +
          '<div class="pill-group">' +
            '<button type="button" data-like="1" class="' + (v.myLike === 1 ? "on" : "") + '" aria-pressed="' + (v.myLike === 1) + '" aria-label="Like this video">' + I.thumbUp + '<span class="num">' + fmtCount(likedCount(v)) + "</span></button>" +
            '<span class="pill-divider" aria-hidden="true"></span>' +
            '<button type="button" data-like="-1" class="' + (v.myLike === -1 ? "on" : "") + '" aria-pressed="' + (v.myLike === -1) + '" aria-label="Dislike this video">' + I.thumbDown + '<span class="num">' + fmtCount(dislikedCount(v)) + "</span></button>" +
          "</div>" +
          (db.watchLater.includes(v.id) ? '<button class="action-btn on" type="button" data-toggle-later>' + I.clock + "Saved</button>" : "") +
          '<button class="action-btn" type="button" data-share>' + I.share + "Share</button>" +
          '<button class="action-btn" type="button" data-save>' + I.save + "Save</button>" +
          '<button class="action-btn" type="button" data-video-menu aria-label="More actions">' + I.more + "</button>" +
        "</div>" +
      "</div>" +
      '<div class="w-desc collapsed" data-desc tabindex="0" role="button" aria-expanded="false">' +
        '<div class="stats"><span data-view-count>' + fmtViews(v.views) + "</span><span>" + fmtDate(v.createdAt) + "</span>" +
          (isMine(v) ? '<span class="badge">' + esc(v.visibility.toUpperCase()) + "</span>" : '<span class="badge">' + esc(v.category || "VIDEO") + "</span>") +
        "</div>" +
        '<div class="text">' + (desc ? esc(desc) : "<em>No description yet.</em>") + "</div>" +
        '<span class="more">Show more</span>' +
      "</div>" +
      commentsMarkup(v) +
    "</div>" +
    '<aside class="watch-side"><div class="rel-title">Up next</div>' +
      related.map(relItem).join("") +
      '<div class="side-note"><b>MEDIABOX / PLAYBACK</b>Keys: <span class="kbd">space</span> play · <span class="kbd">←→</span> seek · <span class="kbd">f</span> fullscreen · <span class="kbd">m</span> mute</div>' +
    "</aside>" +
  "</div>";

  return {
    html: html,
    title: v.title,
    mount: function () {
      mountPlayer($("#player-host"), v);
      wireWatch(v);
    }
  };
}

function commentsMarkup(v) {
  const list = (v.comments || []).slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
  const m = me();
  return '<section class="comments" data-comments>' +
    '<div class="comments-head"><h3 data-comment-count>' + list.length + " Comment" + (list.length === 1 ? "" : "s") + "</h3></div>" +
    (m
      ? '<form class="comment-form" data-comment-form>' + avatar(m, "sm") +
          '<div class="field-inline"><textarea name="text" rows="1" placeholder="Add a comment…" aria-label="Add a comment"></textarea>' +
          '<div class="form-actions"><button type="button" class="btn ghost sm" data-comment-cancel>Cancel</button>' +
          '<button type="submit" class="btn primary sm" disabled>Comment</button></div></div></form>'
      : emptyState(I.user, "Join the conversation", "Create a channel to comment on videos.", '<button class="btn primary sm" type="button" data-create-channel>Create a channel</button>')) +
    '<div data-comment-list>' + (list.map(commentHtml).join("") || '<p style="color:var(--dim);font-size:13px">No comments yet — start the conversation.</p>') + "</div>" +
  "</section>";
}

function commentHtml(c) {
  const author = c.authorId ? chById(c.authorId) : null;
  const name = author ? author.name : (c.authorName || "Viewer");
  const av = author
    ? avatar(author, "sm")
    : '<span class="av av-sm" style="background:#4a5a52">' + esc(name.slice(0, 1).toUpperCase()) + "</span>";
  const mine = !!author && author.id === db.me;
  return '<div class="comment" data-comment="' + esc(c.id) + '">' + av +

    (mine ? '<button type="button" class="del" data-comment-delete="' + esc(c.id) + '">Delete</button>' : "") +

}

function wireWatch(v) {
  const playerHost = $("#player-host");
  const safe = function (sel) { return $(sel, playerHost ? playerHost.parentElement : document); };

  function refreshLikes() {
    $$("[data-like]").forEach(function (b) {
      const val = Number(b.dataset.like);
      const on = v.myLike === val;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
      const num = $(".num", b);
      if (num) num.textContent = fmtCount(val === 1 ? likedCount(v) : dislikedCount(v));
    });
  }
  $$("[data-like]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      const val = Number(b.dataset.like);
      v.myLike = v.myLike === val ? 0 : val;
      saveDb();
      refreshLikes();
      toast(v.myLike === 1 ? "Added to Liked videos" : v.myLike === -1 ? "Feedback saved — we will show fewer videos like this" : "Rating removed",
        v.myLike === -1 ? I.thumbDown : I.thumbUp);
    });
  });

  const sub = $("[data-subscribe]");
  if (sub) {
    sub.addEventListener("click", function () {
      toggleSubscribe(chById(sub.dataset.subscribe));
      const on = isSubscribed(chById(sub.dataset.subscribe));
      sub.textContent = on ? "Subscribed" : "Subscribe";
      sub.classList.toggle("primary", !on);
      $$("[data-subs]").forEach(function (el) { el.textContent = fmtCount(subCount(chById(sub.dataset.subscribe))) + " subscribers"; });
    });
  }

  $$("[data-share]").forEach(function (b) { b.addEventListener("click", function () { shareVideo(v); }); });
  $$("[data-save]").forEach(function (b) { b.addEventListener("click", function () { openSaveModal(v); }); });
  $$("[data-toggle-later]").forEach(function (b) { b.addEventListener("click", function () { toggleLater(v); render(); }); });
  const more = $("[data-video-menu]");
  if (more) more.addEventListener("click", function (e) { e.stopPropagation(); openVideoMenu(more, v); });

  const desc = $("[data-desc]");
  if (desc) {
    const textEl = $(".text", desc);
    const moreBtn = $(".more", desc);
    const overflowing = textEl && textEl.scrollHeight > textEl.clientHeight + 2;
    if (!overflowing) {
      desc.classList.remove("collapsed");
      desc.setAttribute("aria-expanded", "true");
      if (moreBtn) moreBtn.style.display = "none";
    }
    desc.addEventListener("click", function () {
      const collapsed = desc.classList.toggle("collapsed");
      desc.setAttribute("aria-expanded", String(!collapsed));
      $(".more", desc).textContent = collapsed ? "Show more" : "Show less";
    });
    desc.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); desc.click(); }
    });
  }

  const form = $("[data-comment-form]");
  if (form) {
    const ta = $("textarea", form);
    const submit = $('button[type="submit"]', form);
    const actions = $(".form-actions", form);
    actions.style.display = "none";
    ta.addEventListener("focus", function () { actions.style.display = "flex"; });
    ta.addEventListener("input", function () { submit.disabled = !ta.value.trim(); });
    $("[data-comment-cancel]", form).addEventListener("click", function () {
      ta.value = ""; submit.disabled = true; actions.style.display = "none"; ta.blur();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const text = ta.value.trim();
      if (!text) return;
      const m = me();
      if (!m) return;
      v.comments = v.comments || [];
      v.comments.push({ id: uid("c"), authorId: m.id, text: text, createdAt: Date.now(), likes: 0 });
      saveDb();
      ta.value = ""; submit.disabled = true; actions.style.display = "none";
      refreshComments(v);
      toast("Comment posted");
    });
  }

  const list = $("[data-comment-list]");
  if (list) {
    list.addEventListener("click", function (e) {
      const likeBtn = e.target.closest("[data-comment-like]");
      if (likeBtn) {
        const c = (v.comments || []).find(function (x) { return x.id === likeBtn.dataset.commentLike; });
        if (!c) return;
        c.myLike = !c.myLike;
        c.likes = Math.max(0, (c.likes || 0) + (c.myLike ? 1 : -1));
        saveDb();
        likeBtn.classList.toggle("on", c.myLike);
        $("span", likeBtn).textContent = c.likes;
        return;
      }
      const del = e.target.closest("[data-comment-delete]");
      if (del) {
        v.comments = (v.comments || []).filter(function (x) { return x.id !== del.dataset.commentDelete; });
        saveDb();
        refreshComments(v);
        toast("Comment deleted", I.trash);
      }
    });
  }
  function refreshComments(vid) {
    const listEl = $("[data-comment-list]");
    const arr = (vid.comments || []).slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    if (listEl) listEl.innerHTML = arr.map(commentHtml).join("") || '<p style="color:var(--dim);font-size:13px">No comments yet — start the conversation.</p>';
    const cnt = $("[data-comment-count]");
    if (cnt) cnt.textContent = arr.length + " Comment" + (arr.length === 1 ? "" : "s");
  }
}

        '<div class="pl-meta"><span>' + esc(owner.name) + "</span><span>•</span><span>" + vids.length + " videos</span><span>•</span><span>" + fmtViews(p.views || 0) + "</span><span>•</span><span>" + (p.visibility || "public") + "</span></div>" +
        (p.description ? '<div class="pl-desc">' + esc(p.description) + "</div>" : "") +
        '<div class="pl-actions">' +
          (vids.length ? '<button class="btn primary" type="button" data-play-all>' + I.play + "Play all</button>" : "") +
          (own ? '<button class="btn" type="button" data-pl-edit>' + I.edit + "Edit</button>" +
                 '<button class="btn" type="button" data-pl-delete>' + I.trash + "Delete playlist</button>"
               : '<button class="btn" type="button" data-save-playlist>' + I.save + "Save playlist</button>") +
          '<span class="kbd">' + fmtDur(total) + " total</span>" +
        "</div></div></div>" +
    '<div class="pl-list">' + (vids.length ? '<div class="play-all" data-play-all>' + '<span class="playcircle">' + I.play + "</span>" + "<div><b>Play all</b><small>" + vids.length + " videos · " + fmtDur(total) + "</small></div></div>" : "") +
      rows + "</div>" +
    (!vids.length ? emptyState(I.playlist, "This playlist is empty", own ? "Add videos from the Save button on any watch page." : "Nothing has been added yet.", own ? '<button class="btn primary" data-go="/">Browse videos</button>' : "") : "") +
    '<div class="note-strip">Playlist visibility: ' + esc(p.visibility || "public") + " · created " + fmtDate(p.createdAt) + "</div>" +

  return {

      });
      const edit = $("[data-pl-edit]");
      if (edit) edit.addEventListener("click", function () { openPlaylistModal({ playlist: p }); });

        });
      });
    }
  };
}

function viewResults(q) {
  const query = q.trim();
  const lower = query.toLowerCase();
  if (!query) {
    return {
      html: '<div class="page page-narrow"><div class="page-head"><div><div class="page-title">Search</div><p class="page-sub">Type something above — a title, a channel, a mood.</p></div></div>' +
        emptyState(I.search, "Search MediaBox", "Try “poster”, “ambient”, “sourdough” or a channel name.", "") + "</div>",
      title: "Search"
    };
  }
  const vids = allPublic().filter(function (v) {
    const ch = chById(v.channelId);
    return (v.title + " " + v.description + " " + v.category + " " + (ch ? ch.name : "")).toLowerCase().indexOf(lower) >= 0;
  }).sort(function (a, b) { return b.views - a.views; });
  const chs = db.channels.filter(function (c) { return (c.name + " " + c.handle + " " + c.description).toLowerCase().indexOf(lower) >= 0; });
  const pls = db.playlists.filter(function (p) {
    return p.visibility !== "private" && (p.title + " " + (p.description || "")).toLowerCase().indexOf(lower) >= 0;
  });

  let html = '<div class="page page-narrow"><div class="page-head"><div><div class="page-title">Results for “' + esc(query) + '”</div>' +
    '<p class="page-sub">' + (vids.length + chs.length + pls.length) + " result" + (vids.length + chs.length + pls.length === 1 ? "" : "s") + "</p></div></div>";

  if (chs.length) {
    html += '<div class="section-head"><h2>Channels</h2><span class="line"></span><span class="count">' + chs.length + "</span></div><div class=\"tile-grid\">" +
      chs.map(function (c) {
        return '<div class="tile" data-go="/channel/' + c.id + '" role="link" tabindex="0">' +
          '<div class="art" style="background:transparent">' + avatar(c, "lg", "sq") + "</div>" +
          '<div class="tile-text"><span class="tag">CHANNEL</span><b>' + esc(c.name) + "</b><small>@" + esc(c.handle) + " • " + fmtCount(subCount(c)) + " subscribers</small></div></div>";
      }).join("") + "</div>";
  }
  if (vids.length) {
    html += '<div class="section-head" style="margin-top:32px"><h2>Videos</h2><span class="line"></span><span class="count">' + vids.length + "</span></div>" + vids.map(resultRow).join("");
  }
  if (pls.length) {
    html += '<div class="section-head" style="margin-top:32px"><h2>Playlists</h2><span class="line"></span><span class="count">' + pls.length + "</span></div><div class=\"tile-grid\">" + pls.map(playlistTile).join("") + "</div>";
  }
  if (!vids.length && !chs.length && !pls.length) {
    html += emptyState(I.search, "No results", "Nothing matched “" + query + "”. Try a shorter word or a different category.");
  }
  html += "</div>";
  return { html: html, title: "Search: " + query };
}

const modalStack = [];
let modalSeq = 0;
function openModal(opts) {
  const id = "modal-" + (++modalSeq);
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML =
    '<div class="modal ' + (opts.wide ? "wide " : "") + (opts.narrow ? "narrow " : "") + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '">' +
      '<div class="modal-head"><div class="mh-text"><h2 id="' + id + '">' + esc(opts.title || "") + "</h2>" +
        (opts.sub ? "<p>" + esc(opts.sub) + "</p>" : "") + "</div>" +
        '<button class="modal-close" type="button" aria-label="Close dialog">' + I.close + "</button></div>" +
      '<div class="modal-body">' + (opts.body || "") + "</div>" +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + "</div>" : "") +
    "</div>";
  $("#modal-root").appendChild(overlay);

  const api = {
    overlay: overlay,
    modal: $(".modal", overlay),
    body: $(".modal-body", overlay),
    id: id,
    close: close
  };
  function close() {
    if (!overlay.parentNode) return;
    overlay.remove();
    const i = modalStack.indexOf(api);
    if (i >= 0) modalStack.splice(i, 1);
    if (!modalStack.length) {
      document.body.style.overflow = "";
      document.body.classList.remove("modal-open");
    }
    if (opts.onClose) opts.onClose();
  }
  modalStack.push(api);
  document.body.style.overflow = "hidden";
  document.body.classList.add("modal-open");
  $(".modal-close", overlay).addEventListener("click", close);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
  if (opts.mount) opts.mount(api);
  setTimeout(function () {
    const target = overlay.querySelector("[data-autofocus]") || overlay.querySelector(".modal-body input, .modal-body textarea, .modal-body select, .modal-foot .btn") || overlay.querySelector("button");
    if (target) { try { target.focus(); } catch (e) {} }
  }, 40);
  return api;
}

const sanitizeHandle = function (s) {
  return String(s || "").trim().toLowerCase().replace(/^@+/, "").replace(/\s+/g, "").replace(/[^a-z0-9._-]/g, "").slice(0, 24);
};

function readImage(file, maxW, maxH, quality, cover) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const c = document.createElement("canvas");
      let w, h, dx = 0, dy = 0, dw = img.width, dh = img.height;
      if (cover) {
        c.width = maxW; c.height = maxH;
        const s = Math.max(maxW / img.width, maxH / img.height);
        dw = img.width * s; dh = img.height * s;
        dx = (maxW - dw) / 2; dy = (maxH - dh) / 2;
        c.getContext("2d").drawImage(img, dx, dy, dw, dh);
      } else {
        const s = Math.min(1, maxW / img.width, maxH / img.height);
        w = Math.round(img.width * s); h = Math.round(img.height * s);
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality || 0.8));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function captureFrame(videoEl, frac) {
  return new Promise(function (resolve) {
    if (!videoEl) return resolve(null);
    const vw = videoEl.videoWidth || 16, vh = videoEl.videoHeight || 9;
    const dur = videoEl.duration;
    function grab() {
      try {
        const c = document.createElement("canvas");
        c.width = 640; c.height = 360;
        const ctx = c.getContext("2d");
        const s = Math.max(640 / vw, 360 / vh);
        const dw = vw * s, dh = vh * s;
        ctx.drawImage(videoEl, (640 - dw) / 2, (360 - dh) / 2, dw, dh);
        resolve(c.toDataURL("image/jpeg", 0.76));
      } catch (e) { resolve(null); }
    }
    if (!isFinite(dur) || dur <= 0) return resolve(null);
    const target = clamp(frac, 0, 0.96) * dur;
    let done = false;
    function once() { if (done) return; done = true; videoEl.removeEventListener("seeked", once); grab(); }
    videoEl.addEventListener("seeked", once);
    try { videoEl.currentTime = target; } catch (e) { resolve(null); }
    setTimeout(once, 900);
  });
}

    '<div class="hint" data-upload-hint>' + (editing ? "Changes are saved to this browser." : "Video files are stored in IndexedDB in this browser. Large files may not fit.") + "</div>";

  const body = editing
    ? '<div data-fields>' + fields + "</div>"
    : '<div class="upload-zone" data-drop role="button" tabindex="0" aria-label="Choose a video file">' +
        '<div class="uz-icon">' + I.upload + "</div>" +
        "<b>Drag a video here, or click to browse</b>" +
        "<small>MP4, WebM, MOV or OGG — the file never leaves this device</small>" +
        '<input type="file" accept="video/*" data-file hidden></div>' +
      '<div data-file-info></div>' +
      '<div data-fields class="hidden">' +
        '<video class="video-preview" data-preview controls muted playsinline preload="metadata"></video>' +
        fields +
      "</div>";

  const api = openModal({
    title: editing ? "Edit video" : "Upload a video",
    sub: editing ? "Update the details. The file itself stays as it is." : "A title, a thumbnail, and you are on the shelf.",
    wide: true,
    body: body,
    footer: '<button class="btn ghost" type="button" data-close>Cancel</button>' +
      '<button class="btn primary" type="button" data-publish>' + (editing ? "Save changes" : "Publish") + "</button>",
    mount: function (api) {
      const q = function (sel) { return $(sel, api.overlay); };
      const publishBtn = q("[data-publish]");
      const fieldsEl = q("[data-fields]");
      const titleInput = q("[data-title]");
      const thumbImg = q("[data-thumb-preview]");
      const thumbEmpty = q("[data-thumb-empty]");
      const frameRange = q("[data-frame]");
      const preview = q("[data-preview]");
      const frameBox = q(".tp-view");

      function setThumb(data) {
        thumb = data;
        if (thumbImg) {
          if (data) { thumbImg.src = data; thumbImg.style.display = "block"; if (thumbEmpty) thumbEmpty.style.display = "none"; }
          else { thumbImg.style.display = "none"; if (thumbEmpty) thumbEmpty.style.display = "grid"; }
        }
      }
      if (thumb) setThumb(thumb);

      function handleFile(f) {
        if (!f) return;
        if (!/^video\//.test(f.type || "")) { toast("That does not look like a video file", I.film); return; }
        if (f.size > 1.6 * 1024 * 1024 * 1024) { toast("That file is larger than 1.6 GB — too big for browser storage", I.film); return; }
        file = f;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(f);
        fieldsEl.classList.remove("hidden");
        const info = q("[data-file-info]");
        if (info) {
          info.innerHTML = '<div class="file-pill">' + I.check + '<div class="fp-main"><b>' + esc(f.name) + "</b><small>" +
            (f.size / 1024 / 1024).toFixed(1) + " MB" + (f.type ? " · " + esc(f.type.replace("video/", "")) : "") + "</small></div></div>";
        }
        if (preview) {
          preview.src = previewUrl;
          preview.addEventListener("loadedmetadata", function once() {
            preview.removeEventListener("loadedmetadata", once);
            meta.duration = preview.duration || 0;
            if (!titleInput.value.trim()) {
              titleInput.value = f.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 100);
            }
            captureFrame(preview, 0.32).then(function (d) { if (d && !customThumb) setThumb(d); });
          });
        }
        toast("Video ready to describe");
      }

      if (!editing) {
        const drop = q("[data-drop]");
        const fileInput = q("[data-file]");
        drop.addEventListener("click", function (e) { if (e.target !== fileInput) fileInput.click(); });
        drop.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
        });
        fileInput.addEventListener("change", function () { handleFile(fileInput.files && fileInput.files[0]); });
        ["dragenter", "dragover"].forEach(function (ev) {
          drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("drag"); });
        });
        ["dragleave", "drop"].forEach(function (ev) {
          drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("drag"); });
        });
        drop.addEventListener("drop", function (e) {
          const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          handleFile(f);
        });
      }

      if (frameRange && preview) {
        frameRange.addEventListener("pointerup", function () {
          const frac = Number(frameRange.value) / 100;
          customThumb = false;
          captureFrame(preview, frac).then(function (d) { if (d) setThumb(d); });
        });
        frameRange.addEventListener("change", function () {
          if (!preview || !preview.duration) return;
          preview.currentTime = clamp(Number(frameRange.value) / 100, 0, 0.96) * preview.duration;
        });
      }

      const thumbFile = q("[data-thumb-file]");
      q("[data-thumb-upload]").addEventListener("click", function () { thumbFile.click(); });
      thumbFile.addEventListener("change", function () {
        const f = thumbFile.files && thumbFile.files[0];
        if (!f) return;
        readImage(f, 640, 360, 0.76, true).then(function (data) {
          customThumb = true;
          setThumb(data);
        }).catch(function () { toast("That image could not be read."); });
      });

      $$("[data-close]", api.overlay).forEach(function (b) { b.addEventListener("click", api.close); });

      publishBtn.addEventListener("click", async function () {
        if (saving) return;
        const title = titleInput.value.trim();
        if (!title) { toast("Give the video a title first", I.video); titleInput.focus(); return; }
        if (!editing && !file) { toast("Pick a video file first", I.upload); return; }
        saving = true;
        publishBtn.disabled = true;
        const oldLabel = publishBtn.textContent;
        publishBtn.textContent = "Saving…";
        const data = {
          title: title,
          description: q("[data-description]").value.trim(),
          category: q("[data-category]").value || "Design",
          visibility: q("[data-vis]").value || "public",
          thumb: thumb || null,
          duration: Math.round(meta.duration || (editing ? editing.duration : 0) || 0)
        };
        if (editing) {
          Object.assign(editing, data);
          saveDb();
          api.close();
          toast("Video updated", I.check);
          render();
          renderSidebar();
          return;
        }
        try {
          const mediaId = uid("m");
          await MediaStore.put(mediaId, file);
          urlCache.set(mediaId, previewUrl);
          previewUrl = null;
          const v = {
            id: uid("v"), channelId: db.me, title: data.title, description: data.description,
            category: data.category, visibility: data.visibility, createdAt: Date.now(),
            views: 0, likesBase: 0, dislikesBase: 0, myLike: 0, duration: data.duration || 0,
            demo: null, mediaId: mediaId, thumb: data.thumb, comments: []
          };
          db.videos.push(v);
          if (!saveDb()) saveDb();
          api.close();
          toast("“" + v.title + "” is live", I.sparkle);
          renderSidebar();
          goto("/watch/" + v.id);
        } catch (err) {
          console.error(err);
          toast("Could not save the file — browser storage may be full.", I.trash);
          publishBtn.disabled = false;
          publishBtn.textContent = oldLabel;
          saving = false;
        }
      });
    }
  });
  return api;
}

function confirmDeleteVideo(v) {
  confirmDialog("Delete this video?", "“" + v.title + "” will be removed from your channel, playlists and Watch later. Uploaded files are deleted from browser storage. This cannot be undone.", "Delete video", async function () {
    db.videos = db.videos.filter(function (x) { return x.id !== v.id; });
    db.playlists.forEach(function (p) { p.videoIds = p.videoIds.filter(function (id) { return id !== v.id; }); });
    db.watchLater = db.watchLater.filter(function (id) { return id !== v.id; });
    if (v.mediaId) {
      try { await MediaStore.del(v.mediaId); } catch (e) {}
      const u = urlCache.get(v.mediaId);
      if (u) { try { URL.revokeObjectURL(u); } catch (e) {} urlCache.delete(v.mediaId); }
    }
    saveDb();
    toast("Video deleted", I.trash);
    if (currentRoute().parts[0] === "watch" && currentRoute().parts[1] === v.id) goto("/");
    else render();
    renderSidebar();
  });
}

function openSaveModal(v) {
  const api = openModal({
    title: "Save video",

    footer: '<button class="btn ghost" type="button" data-close>Done</button>'
  });

  function draw() {
    const m = me();

      '<button class="check-row ' + (db.watchLater.includes(v.id) ? "on" : "") + '" type="button" data-later-row>' +

      html += '<div class="modal-list-head" style="margin-top:16px"><span>Playlists</span><button class="link-btn" type="button" data-new-pl>+ New playlist</button></div>';
      html += pls.length
        ? pls.map(function (p) {

          }).join("")
        : '<div class="side-empty" style="padding:8px 2px">No playlists yet — make your first one here.</div>';
    } else {
      html += '<div class="divider"></div><div class="empty" style="padding:22px"><p>Create a channel to collect videos into playlists.</p>' +
        '<button class="btn primary sm" type="button" data-create-channel>Create a channel</button></div>';
    }
    holder.innerHTML = html;

  draw();
  holder.addEventListener("click", function (e) {

      return;

    const pl = e.target.closest("[data-pl-row]");

      const p = playlistById(pl.dataset.plRow);
      if (!p) return;
      const i = p.videoIds.indexOf(v.id);

      else { p.videoIds.push(v.id); toast("Saved to " + p.title, I.check); }

      '<div class="note-strip" style="margin-top:16px">MediaBox is a single HTML file. No account, no server, no tracking — localStorage holds the metadata and IndexedDB holds uploaded video files.</div>',
    footer: '<button class="btn" type="button" data-close>Close</button>'
  });
  const q = function (sel) { return $(sel, api.overlay); };
  $$("[data-close]", api.overlay).forEach(function (b) { b.addEventListener("click", api.close); });
  $$("[data-theme-set]", api.overlay).forEach(function (b) {

      setTheme(b.dataset.themeSet);
      $$("[data-theme-set]", api.overlay).forEach(function (x) { x.classList.toggle("on", x.dataset.themeSet === b.dataset.themeSet); });
    });
  });
  $$("[data-accent-set]", api.overlay).forEach(function (b) {
    b.addEventListener("click", function () { setAccent(b.dataset.accentSet); });
  });
  const cz = q("[data-customize]");
  if (cz) cz.addEventListener("click", function () { api.close(); openChannelModal({ edit: true }); });
  const sw = q("[data-switch]");
  if (sw) sw.addEventListener("click", function () { api.close(); openSwitchChannelModal(); });
  const openV = q("[data-open-videos]");
  if (openV) openV.addEventListener("click", function () { api.close(); goto("/your-videos"); });
  q("[data-reset]").addEventListener("click", function () {
    api.close();
    confirmDialog("Reset MediaBox?", "This deletes your channel, uploads, playlists, likes and settings, then reloads the demo library. It cannot be undone.", "Reset everything", async function () {
      await clearAllMedia();
      try {
        Object.keys(localStorage).forEach(function (k) { if (k.indexOf("mediabox:") === 0) localStorage.removeItem(k); });
        sessionStorage.clear();
      } catch (e) {}
      location.reload();
    });
  });
}

function clearAllMedia() {
  return new Promise(function (resolve) {
    try {
      const req = indexedDB.open("mediabox-media", 1);
      req.onsuccess = function () {
        try {
          const d = req.result;
          const tx = d.transaction("files", "readwrite");
          tx.objectStore("files").clear();
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        } catch (e) { resolve(false); }
      };
      req.onerror = function () { resolve(false); };
    } catch (e) { resolve(false); }
  });
}

    if (act === "channel") goto("/channel/" + m.id);
    else if (act === "upload") openUploadModal();
    else if (act === "studio") goto("/your-videos");
    else if (act === "playlist") openPlaylistModal();
    else if (act === "customize") openChannelModal({ edit: true });
    else if (act === "switch") openSwitchChannelModal();
    else if (act === "settings") openSettingsModal();
    else if (act === "theme") setTheme(dark ? "light" : "dark");
  });
}

function toggleSidebar() {
  if (window.innerWidth <= 960) {
    document.body.classList.toggle("side-open");
    return;
  }
  const rail = document.documentElement.dataset.rail === "1";
  if (rail) delete document.documentElement.dataset.rail;
  else document.documentElement.dataset.rail = "1";
  try { localStorage.setItem("mediabox:rail", rail ? "0" : "1"); } catch (e) {}
}

function wireHeader() {
  $("#menu-btn").addEventListener("click", toggleSidebar);
  $("#scrim").addEventListener("click", closeSidebar);
  $("#theme-btn").addEventListener("click", function () {
    setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  });
  $("#settings-btn").addEventListener("click", openSettingsModal);
  $("#account-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    if (currentPop) { closePop(); return; }
    if (me()) openAccountMenu();
    else openGuestMenu();
  });
  $("#create-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    if (currentPop) { closePop(); return; }
    openCreateMenu();
  });

  const form = $("#search-form");
  const input = $("#search-input");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const q = input.value.trim();
    document.body.classList.remove("msearch");
    goto("/results" + (q ? "?q=" + encodeURIComponent(q) : ""));
    input.blur();
  });
  $("#mobile-search-btn").addEventListener("click", function () {
    if (document.body.classList.contains("msearch")) {
      document.body.classList.remove("msearch");
      return;
    }
    document.body.classList.add("msearch");
    input.focus();
  });
}

document.addEventListener("click", function (e) {
  if (!e.target || typeof e.target.closest !== "function") return;
  if (e.target.closest("#menu-root")) return;

  const more = e.target.closest("[data-menu-video]");
  if (more) {
    e.preventDefault();
    openVideoMenu(more, videoById(more.dataset.menuVideo));
    return;
  }
  const chip = e.target.closest("[data-chip]");
  if (chip) {
    state.category = chip.dataset.chip;
    render();
    return;
  }
  if (e.target.closest("[data-create-channel]")) {
    e.preventDefault();
    openChannelModal();
    return;
  }
  if (e.target.closest("[data-upload]")) {
    e.preventDefault();
    openUploadModal();
    return;
  }
  if (e.target.closest("[data-new-playlist]")) {
    e.preventDefault();
    openPlaylistModal();
    return;
  }
  if (e.target.closest("[data-dismiss-setup]")) {
    db.setupDismissed = true; saveDb(); render();
    return;
  }
  const go = e.target.closest("[data-go]");
  if (go) {
    const p = go.dataset.go;
    if (p) { e.preventDefault(); goto(p); }
    return;
  }
  if (!e.target.closest("[aria-haspopup]")) closePop();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (modalStack.length) { e.preventDefault(); modalStack[modalStack.length - 1].close(); return; }
    if (currentPop) { closePop(); return; }
    if (document.body.classList.contains("msearch")) { document.body.classList.remove("msearch"); return; }
    if (document.body.classList.contains("side-open")) { closeSidebar(); return; }
  }
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
    e.preventDefault();
    if (window.innerWidth <= 760) document.body.classList.add("msearch");
    $("#search-input").focus();
  }
  if (e.key === "Enter" && document.activeElement && document.activeElement.closest("[data-go]")) {
    const g = document.activeElement.closest("[data-go]");
    if (g.tagName !== "BUTTON") { e.preventDefault(); goto(g.dataset.go); }
  }
});

window.addEventListener("scroll", function () { if (currentPop) closePop(); }, { passive: true });
window.addEventListener("resize", function () { if (currentPop) closePop(); });
window.addEventListener("hashchange", function () {
  render();
  window.scrollTo(0, 0);
});

/* ============================================================
   14. Boot
   ============================================================ */
function boot() {
  syncThemeBtn();
  syncAccountBtn();
  renderSidebar();
  wireHeader();
  render();
  if (!location.hash) {
    try { history.replaceState(null, "", "#/"); } catch (e) {}
  }
  // keep the search box in sync when landing on a results URL
  const r = currentRoute();
  if (r.parts[0] === "results") $("#search-input").value = r.params.get("q") || "";
  // first-visit nudge, once per session
  try {
    if (!me() && !db.setupDismissed && !sessionStorage.getItem("mediabox:welcome")) {
      sessionStorage.setItem("mediabox:welcome", "1");
    }
  } catch (e) {}
}

boot();

})();
</script>
</body>
</html>
